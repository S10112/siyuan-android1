<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <style>
        html {
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            height: 100%;
            margin: 0;
            background: #1e1e1e;
            font-size: 12px;
            font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
        }

        #bootAppearance {
            position: fixed;
            z-index: 0;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #bootAppearance.boot-appearance--loaded {
            opacity: 1;
        }

        #bg {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            pointer-events: none;
        }

        #bg img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        #progressWrap {
            position: absolute;
            z-index: 2;
            bottom: env(safe-area-inset-bottom);
            width: 100%;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #progressTrack {
            position: absolute;
            height: 2px;
            background-color: #2a2c2f;
            width: 100%;
            top: 0;
        }

        #progress {
            position: absolute;
            height: 2px;
            background-color: #3b3e43;
            box-shadow: 0 0 8px rgba(59, 62, 67, 0.6);
            transition: width 0.6s cubic-bezier(0, 0, 0.2, 1);
            top: 0;
            width: 0;
        }

        #details {
            color: #9aa0a6;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            padding: 8px;
            height: 16px;
            line-height: 16px;
        }
    </style>
</head>
<body>
<iframe id="bootAppearance" sandbox="" allow="autoplay" tabindex="-1" aria-hidden="true"></iframe>
<div id="bg">
    <img src="logo.png" alt="Logo" />
</div>
<div id="progressWrap">
    <div id="progressTrack"></div>
    <div id="progress"></div>
    <div id="details"></div>
</div>
<script>
    const getSearch = (key) => {
        if (window.location.search.indexOf('?') === -1) {
            return ''
        }
        let value = ''
        const data = window.location.search.split('?')[1].split('&')
        data.find(item => {
            const keyValue = item.split('=')
            if (keyValue[0] === key) {
                value = keyValue[1]
                return true
            }
        })
        return value
    }

    const redirect = () => {
        const uri = 'http://127.0.0.1:' + location.port
        window.location.replace(uri)
    }

    (async () => {
        const v = getSearch('v')
        const progressEl = document.getElementById('progress')
        const detailsEl = document.getElementById('details')
        detailsEl.textContent = "v" + v + ' Booting kernel...'
        const bootShowStart = Date.now()

        const baseProgress = 15 + Math.random() * 10
        let currentDisplay = 0
        const setProgress = (target) => {
            if (target > currentDisplay) {
                currentDisplay = target
                progressEl.style.width = target + '%'
            }
        }
        setProgress(baseProgress)

        let progressing = false
        const subscribe = () => {
            const es = new EventSource('http://127.0.0.1:' + location.port + '/api/system/bootProgressSSE')
            es.onmessage = (event) => {
                const progressData = JSON.parse(event.data)
                const display = baseProgress + progressData.progress * (100 - baseProgress) / 100
                setProgress(display)
                detailsEl.textContent = progressData.details
                if (progressData.progress >= 100) {
                    progressing = true
                    es.close()
                    setTimeout(redirect, 200)
                }
            }
            es.onerror = () => {
                es.close()
                if (!progressing) {
                    setTimeout(subscribe, 100)
                }
            }
        }
        subscribe()
    })()
</script>
</body>
</html>
