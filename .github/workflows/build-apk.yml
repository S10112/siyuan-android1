name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 自动接受 SDK 许可
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 准备思源必需的签名模板和资源骨架
      - name: Prepare Signing and Assets
        run: |
          cp signings.templates.gradle signings.gradle
          mkdir -p temp_zip/appearance temp_zip/guide temp_zip/stage temp_zip/changelogs
          touch temp_zip/appearance/.keep temp_zip/guide/.keep temp_zip/stage/.keep temp_zip/changelogs/.keep
          cd temp_zip && zip -r ../app.zip . && cd ..
          mkdir -p app/src/main/assets/
          mv app.zip app/src/main/assets/app.zip
          rm -rf temp_zip

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 使用项目自带的打包任务，并传入 compileSdk 变量
      - name: Build APK
        run: ./gradlew assembleGoogleplayDebug -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-debug-apk
          path: app/build/outputs/apk/**/*.apk
