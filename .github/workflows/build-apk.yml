name: Build Android APK (Release CN)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 自动接受 Android SDK 协议
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 步骤 1：修复 Maven 源（彻底消除 aliyun 网络死锁）、拉取干净清单、配置包名与版本号
      - name: Configure App Info and Fix Maven Mirrors
        run: |
          NEW_APP_ID="com.jincheng.note"

          # 1. 核心修复：将所有 gradle 脚本里的 aliyun 镜像替换为官方源，彻底消除 GitHub Actions 访问国内镜像超时
          find . -type f -name "*.gradle" -exec sed -i 's|https*://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' {} +
          find . -type f -name "*.gradle" -exec sed -i 's|https*://maven.aliyun.com/[^'\''"]*|https://repo1.maven.org/maven2|g' {} +
          echo "Maven 仓库已全部切换回官方海外直连源！"

          # 2. 确保清单文件完整并修改应用名
          curl -sSL https://raw.githubusercontent.com/siyuan-note/siyuan-android/main/app/src/main/AndroidManifest.xml -o app/src/main/AndroidManifest.xml
          sed -i 's/android:label="@string\/app_name"/android:label="金成笔记"/g' app/src/main/AndroidManifest.xml
          sed -i 's/android:label="思源笔记"/android:label="金成笔记"/g' app/src/main/AndroidManifest.xml

          # 3. 大幅提升版本号强刷缓存
          sed -i "s/siyuanVersionCode = .*/siyuanVersionCode = 99999/g" build.gradle || true
          sed -i "s/siyuanVersionName = .*/siyuanVersionName = \"9.9.9\"/g" build.gradle || true
          
          # 4. 配置包名
          sed -i "s/applicationId \".*\"/applicationId \"${NEW_APP_ID}\"/g" app/build.gradle
          if [ -f flavors.gradle ]; then
            sed -i "s/applicationId \".*\"/applicationId \"${NEW_APP_ID}\"/g" flavors.gradle
            sed -i "s/applicationPackageName = \".*\"/applicationPackageName = \"${NEW_APP_ID}\"/g" flavors.gradle
          fi

      # 步骤 2：生成 Android 原生桌面图标与启动图
      - name: Replace Native Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          if [ -f logo.png ]; then
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            rm -f app/src/main/res/drawable/launcher_foreground.xml
            rm -f app/src/main/res/drawable-v24/launcher_foreground.xml

            mkdir -p app/src/main/res/drawable
            convert logo.png -resize 192x192 -strip -define png:format=png32 app/src/main/res/drawable/icon.png
            convert logo.png -resize 256x256 -strip -define png:format=png32 app/src/main/res/drawable/boot_logo.png

            for res in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              DIR="app/src/main/res/mipmap-${res%%:*}"
              SIZE="${res##*:}"
              mkdir -p "$DIR"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/ic_launcher.png"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/ic_launcher_round.png"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/shorthand_icon.png"
            done
          fi

      # 步骤 3：以官方完整资源为底包，彻底重写开屏 index.html（绝对无折纸、绝不报 404）
      - name: Prepare Assets and Inject Pure Custom Splash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y zip unzip python3
          mkdir -p temp_apk
          cd temp_apk
          gh release download --repo siyuan-note/siyuan --pattern "*.apk" --clobber
          APK_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          unzip -q "$APK_FILE"
          cd ..
          
          mkdir -p web_assets
          unzip -q temp_apk/assets/app.zip -d web_assets/

          # 创建 Python 脚本将 Base64 Logo 写入全新的 boot index.html
          echo "import base64" > write_boot.py
          echo "with open('logo.png', 'rb') as f:" >> write_boot.py
          echo "    b64 = base64.b64encode(f.read()).decode('utf-8')" >> write_boot.py
          echo "uri = f'data:image/png;base64,{b64}'" >> write_boot.py
          echo "html = '''<!DOCTYPE html>" >> write_boot.py
          echo "<html><head><meta charset=\"UTF-8\">" >> write_boot.py
          echo "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover\">" >> write_boot.py
          echo "<style>" >> write_boot.py
          echo "html,body{height:100%;margin:0;overflow:hidden;background:#1e1e1e;}" >> write_boot.py
          echo "#bg{display:flex;justify-content:center;align-items:center;height:100%;width:100%;}" >> write_boot.py
          echo "#bg img{width:140px;height:140px;object-fit:contain;border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,0.4);}" >> write_boot.py
          echo "#progressWrap{position:absolute;bottom:env(safe-area-inset-bottom);width:100%;}" >> write_boot.py
          echo "#progressTrack{height:2px;background-color:#2a2c2f;width:100%;}" >> write_boot.py
          echo "#progress{height:2px;background-color:#3b3e43;box-shadow:0 0 8px rgba(59,62,67,0.6);width:0;transition:width 0.3s;}" >> write_boot.py
          echo "#details{color:#9aa0a6;padding:8px;font-size:12px;font-family:sans-serif;text-align:center;}" >> write_boot.py
          echo "</style></head><body>" >> write_boot.py
          echo "<div id=\"bg\"><img src=\"''' + uri + '''\" alt=\"Logo\"></div>" >> write_boot.py
          echo "<div id=\"progressWrap\"><div id=\"progressTrack\"></div><div id=\"progress\"></div><div id=\"details\"></div></div>" >> write_boot.py
          echo "<script>" >> write_boot.py
          echo "const redirect=()=>{window.location.replace('http://127.0.0.1:'+location.port);};" >> write_boot.py
          echo "const p=document.getElementById('progress'),d=document.getElementById('details');" >> write_boot.py
          echo "p.style.width='25%';d.textContent='Booting kernel...';" >> write_boot.py
          echo "const es=new EventSource('http://127.0.0.1:'+location.port+'/api/system/bootProgressSSE');" >> write_boot.py
          echo "es.onmessage=(e)=>{const data=JSON.parse(e.data);p.style.width=data.progress+'%';d.textContent=data.details;if(data.progress>=100){es.close();setTimeout(redirect,150);}};" >> write_boot.py
          echo "es.onerror=()=>{es.close();setTimeout(()=>{const r=new EventSource('http://127.0.0.1:'+location.port+'/api/system/bootProgressSSE');r.onmessage=es.onmessage;},300);};" >> write_boot.py
          echo "</script></body></html>'''" >> write_boot.py
          echo "with open('web_assets/appearance/boot/index.html', 'w', encoding='utf-8') as f:" >> write_boot.py
          echo "    f.write(html)" >> write_boot.py
          echo "print('全新开屏覆盖完成，原版 SVG 已彻底移除！')" >> write_boot.py

          python3 write_boot.py
          rm -f write_boot.py

          # 重新打成 app.zip 并放入 assets 目录
          mkdir -p app/src/main/assets/
          cd web_assets
          zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/app.zip" ./*
          cd "$GITHUB_WORKSPACE"

          rm -rf temp_apk web_assets

      # 步骤 4：生成正式签名并配置
      - name: Setup Signing Configuration
        run: |
          keytool -genkeypair -v -keystore release.jks -alias siyuan -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Jincheng, OU=Dev, O=JinchengNote, L=BJ, ST=BJ, C=CN"
          cp signings.templates.gradle signings.gradle
          sed -i "s|storeFile .*|storeFile file('../release.jks')|g" signings.gradle
          sed -i "s|storePassword .*|storePassword '123456'|g" signings.gradle
          sed -i "s|keyAlias .*|keyAlias 'siyuan'|g" signings.gradle
          sed -i "s|keyPassword .*|keyPassword '123456'|g" signings.gradle

      # 步骤 5：编译底层 kernel.aar
      - name: Build SiYuan Kernel AAR
        env:
          CGO_ENABLED: '1'
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
        run: |
          git clone --depth=1 https://github.com/siyuan-note/siyuan.git /tmp/siyuan-core
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          gomobile init
          cd /tmp/siyuan-core/kernel
          gomobile bind -tags "fts5 sqlcipher" -ldflags "-s -w" -v -o kernel.aar -target android/arm64 -androidapi 26 ./mobile/
          mkdir -p $GITHUB_WORKSPACE/app/libs/
          cp kernel.aar $GITHUB_WORKSPACE/app/libs/
          rm -rf /tmp/siyuan-core

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 步骤 6：编译国内正式版 (Cn Release)
      - name: Build Domestic Release APK
        run: ./gradlew assembleCnRelease -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      # 步骤 7：上传 APK 安装包
      - name: Upload Domestic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 金成笔记-国内正式版
          path: app/build/outputs/apk/cn/release/*.apk
