name: Build Android APK (Release CN)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 自动接受 Android SDK 协议
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 步骤 1：修复 Maven 源（彻底根除 aliyun 超时死锁）、安全配置应用信息
      - name: Configure App Info and Fix Maven Mirrors
        run: |
          NEW_APP_ID="com.jincheng.note"

          # 替换国内镜像为官方高速源
          find . -type f -name "*.gradle" -exec sed -i 's|https*://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' {} +
          find . -type f -name "*.gradle" -exec sed -i 's|https*://maven.aliyun.com/[^'\''"]*|https://repo1.maven.org/maven2|g' {} +

          # 清单文件安全更名
          curl -sSL https://raw.githubusercontent.com/siyuan-note/siyuan-android/main/app/src/main/AndroidManifest.xml -o app/src/main/AndroidManifest.xml
          sed -i 's/android:label="@string\/app_name"/android:label="金成笔记"/g' app/src/main/AndroidManifest.xml
          sed -i 's/android:label="思源笔记"/android:label="金成笔记"/g' app/src/main/AndroidManifest.xml

          # 强刷缓存的高版本号
          sed -i "s/siyuanVersionCode = .*/siyuanVersionCode = 99999/g" build.gradle || true
          sed -i "s/siyuanVersionName = .*/siyuanVersionName = \"9.9.9\"/g" build.gradle || true
          
          # 包名配置
          sed -i "s/applicationId \".*\"/applicationId \"${NEW_APP_ID}\"/g" app/build.gradle
          if [ -f flavors.gradle ]; then
            sed -i "s/applicationId \".*\"/applicationId \"${NEW_APP_ID}\"/g" flavors.gradle
            sed -i "s/applicationPackageName = \".*\"/applicationPackageName = \"${NEW_APP_ID}\"/g" flavors.gradle
          fi

      # 步骤 2：安全替换原生图标与启动矢量（不删文件，彻底解决闪退与折纸）
      - name: Replace Native Icons Safely
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          if [ -f logo.png ]; then
            echo "正在安全生成位图资源..."
            mkdir -p app/src/main/res/drawable

            # 生成标准的启动与 Logo PNG 位图
            convert logo.png -resize 256x256 -strip -define png:format=png32 app/src/main/res/drawable/boot_logo.png
            convert logo.png -resize 192x192 -strip -define png:format=png32 app/src/main/res/drawable/icon.png
            convert logo.png -resize 256x256 -strip -define png:format=png32 app/src/main/res/drawable/custom_logo.png

            # 核心防闪退点：保留原本的所有资源引用，将原生工程内所有引用的 logo.xml 改写为指向 custom_logo.png
            find app/src/main/res/ -name "logo.xml" -exec sh -c '
              cat << "EOF" > "$1"
<?xml version="1.0" encoding="utf-8"?>
<bitmap xmlns:android="http://schemas.android.com/apk/res/android"
    android:src="@drawable/custom_logo"
    android:gravity="center" />
EOF
            ' sh {} \;

            # 各分辨率桌面图标替换
            for res in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              DIR="app/src/main/res/mipmap-${res%%:*}"
              SIZE="${res##*:}"
              mkdir -p "$DIR"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/ic_launcher.png"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/ic_launcher_round.png"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/shorthand_icon.png"
            done
            echo "原生层资源安全覆写完成！"
          fi

      # 步骤 3：下载官方完整前端包并彻底覆写开屏 HTML（保留完整 stage 产物不报 404）
      - name: Prepare Assets and Inject Custom Splash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y zip unzip python3
          mkdir -p temp_apk
          cd temp_apk
          gh release download --repo siyuan-note/siyuan --pattern "*.apk" --clobber
          APK_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          unzip -q "$APK_FILE"
          cd ..
          
          mkdir -p web_assets
          unzip -q temp_apk/assets/app.zip -d web_assets/

          # 自动注入干净的 Base64 自定义 Logo 开屏
          if [ -f logo.png ]; then
            python3 - << 'PY_EOF'
import base64

with open('logo.png', 'rb') as f:
    b64 = base64.b64encode(f.read()).decode('utf-8')
uri = f"data:image/png;base64,{b64}"

html = f"""<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<style>
html,body{{height:100%;margin:0;overflow:hidden;background:#1e1e1e;}}
#bg{{display:flex;justify-content:center;align-items:center;height:100%;width:100%;}}
#bg img{{width:140px;height:140px;object-fit:contain;border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,0.4);}}
#progressWrap{{position:absolute;bottom:env(safe-area-inset-bottom);width:100%;}}
#progressTrack{{height:2px;background-color:#2a2c2f;width:100%;}}
#progress{{height:2px;background-color:#3b3e43;box-shadow:0 0 8px rgba(59,62,67,0.6);width:0;transition:width 0.3s;}}
#details{{color:#9aa0a6;padding:8px;font-size:12px;font-family:sans-serif;text-align:center;}}
</style>
</head>
<body>
<div id="bg"><img src="{uri}" alt="Logo"></div>
<div id="progressWrap"><div id="progressTrack"></div><div id="progress"></div><div id="details"></div></div>
<script>
const redirect=()=>{{window.location.replace('http://127.0.0.1:'+location.port);}};
const p=document.getElementById('progress'),d=document.getElementById('details');
p.style.width='25%';d.textContent='Booting kernel...';
const es=new EventSource('http://127.0.0.1:'+location.port+'/api/system/bootProgressSSE');
es.onmessage=(e)=>{{const data=JSON.parse(e.data);p.style.width=data.progress+'%';d.textContent=data.details;if(data.progress>=100){{es.close();setTimeout(redirect,150);}}}};
es.onerror=()=>{{es.close();setTimeout(()=>{{const r=new EventSource('http://127.0.0.1:'+location.port+'/api/system/bootProgressSSE');r.onmessage=es.onmessage;}},300);}};
</script>
</body>
</html>"""

with open('web_assets/appearance/boot/index.html', 'w', encoding='utf-8') as f:
    f.write(html)
print("前端开屏替换完成！")
PY_EOF
          fi

          mkdir -p app/src/main/assets/
          cd web_assets
          zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/app.zip" ./*
          cd "$GITHUB_WORKSPACE"

          rm -rf temp_apk web_assets

      # 步骤 4：配置签名
      - name: Setup Signing Configuration
        run: |
          keytool -genkeypair -v -keystore release.jks -alias siyuan -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Jincheng, OU=Dev, O=JinchengNote, L=BJ, ST=BJ, C=CN"
          cp signings.templates.gradle signings.gradle
          sed -i "s|storeFile .*|storeFile file('../release.jks')|g" signings.gradle
          sed -i "s|storePassword .*|storePassword '123456'|g" signings.gradle
          sed -i "s|keyAlias .*|keyAlias 'siyuan'|g" signings.gradle
          sed -i "s|keyPassword .*|keyPassword '123456'|g" signings.gradle

      # 步骤 5：编译底层 kernel.aar
      - name: Build SiYuan Kernel AAR
        env:
          CGO_ENABLED: '1'
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
        run: |
          git clone --depth=1 https://github.com/siyuan-note/siyuan.git /tmp/siyuan-core
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          gomobile init
          cd /tmp/siyuan-core/kernel
          gomobile bind -tags "fts5 sqlcipher" -ldflags "-s -w" -v -o kernel.aar -target android/arm64 -androidapi 26 ./mobile/
          mkdir -p $GITHUB_WORKSPACE/app/libs/
          cp kernel.aar $GITHUB_WORKSPACE/app/libs/
          rm -rf /tmp/siyuan-core

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 步骤 6：编译国内正式版
      - name: Build Domestic Release APK
        run: ./gradlew assembleCnRelease -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      # 步骤 7：上传 APK
      - name: Upload Domestic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 金成笔记-国内正式版
          path: app/build/outputs/apk/cn/release/*.apk
