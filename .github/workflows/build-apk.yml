name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 自动接受系统自带 Android SDK 的许可协议
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 注入思源所需的 app.zip 静态资源
      - name: Prepare SiYuan Assets (app.zip)
        run: |
          mkdir -p temp_extract
          cd temp_extract
          APK_URL=$(curl -s https://api.github.com/repos/siyuan-note/siyuan/releases/latest | grep "browser_download_url.*android.*\.apk" | head -n 1 | cut -d '"' -f 4)
          if [ -z "$APK_URL" ]; then
            curl -L -o official.apk https://github.com/siyuan-note/siyuan/releases/download/v3.1.20/siyuan-3.1.20-android.apk
          else
            curl -L -o official.apk "$APK_URL"
          fi
          unzip -q official.apk
          cd ..
          mkdir -p app/src/main/assets/
          cp -r temp_extract/assets/* app/src/main/assets/ || true
          rm -rf temp_extract

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleGoogleplayDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-debug-apk
          path: app/build/outputs/apk/**/*.apk
