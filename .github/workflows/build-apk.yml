name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Signing Config
        run: |
          cp -n signings.templates.gradle signings.gradle || true

      # 仅在仓库中不存在 app.zip 时才去主库拉取
      - name: Fetch Assets if Missing
        if: "!hashFiles('app/src/main/assets/app.zip')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_apk
          cd temp_apk
          gh release download --repo siyuan-note/siyuan --pattern "*.apk" --clobber
          APK_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          unzip -q "$APK_FILE"
          cd ..
          mkdir -p app/src/main/assets/
          cp temp_apk/assets/app.zip app/src/main/assets/
          rm -rf temp_apk

      # 仅在仓库中不存在 kernel.aar 时才拉取主库并编译
      - name: Build Kernel AAR if Missing
        if: "!hashFiles('app/libs/kernel.aar')"
        env:
          CGO_ENABLED: '1'
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
        run: |
          sudo apt-get update && sudo apt-get install -y golang
          git clone --depth=1 https://github.com/siyuan-note/siyuan.git /tmp/siyuan-core
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          gomobile init
          cd /tmp/siyuan-core/kernel
          gomobile bind -tags "fts5 sqlcipher" -ldflags "-s -w" -v -o kernel.aar -target android/arm64 -androidapi 26 ./mobile/
          mkdir -p $GITHUB_WORKSPACE/app/libs/
          cp kernel.aar $GITHUB_WORKSPACE/app/libs/
          rm -rf /tmp/siyuan-core

      # 将生成的依赖自动保存回你的仓库（只在第一次缺少时触发）
      - name: Save Dependencies to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/assets/app.zip app/libs/kernel.aar
          if ! git diff --cached --quiet; then
            git commit -m "chore: cache kernel.aar and app.zip for offline build"
            git push
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 编译 APK
      - name: Build APK
        run: ./gradlew assembleGoogleplayDebug -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-apk
          path: app/build/outputs/apk/**/*.apk
