name: Build Android APK (Release CN)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 自动接受 Android SDK 协议
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 步骤 1：大幅提升版本号并安全配置包名
      - name: Bump Version and Set Package Name
        run: |
          NEW_APP_ID="com.jincheng.note"
          echo "正在升级版本号与包名..."
          sed -i "s/siyuanVersionCode = .*/siyuanVersionCode = 99999/g" build.gradle || true
          sed -i "s/siyuanVersionName = .*/siyuanVersionName = \"9.9.9\"/g" build.gradle || true
          
          sed -i "s/applicationId \".*\"/applicationId \"${NEW_APP_ID}\"/g" app/build.gradle
          if [ -f flavors.gradle ]; then
            sed -i "s/applicationId \".*\"/applicationId \"${NEW_APP_ID}\"/g" flavors.gradle
            sed -i "s/applicationPackageName = \".*\"/applicationPackageName = \"${NEW_APP_ID}\"/g" flavors.gradle
          fi

      # 步骤 2：使用你的 logo.png 彻底覆盖开屏画面与所有桌面图标
      - name: Replace App Icon and Splash Screen
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          if [ -f logo.png ]; then
            echo "检测到自定义 logo.png，正在强力覆写桌面图标与开屏画面..."

            # 1. 精准删除旧的桌面图标矢量规则（保留 shorthand_icon 防止编译报错）
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            rm -f app/src/main/res/drawable/launcher_foreground.xml
            rm -f app/src/main/res/drawable-v24/launcher_foreground.xml

            # 2. 覆盖生成通用 icon.png 以及开屏可能读取的各种命名的 logo
            mkdir -p app/src/main/res/drawable
            convert logo.png -resize 192x192 -strip -define png:format=png32 app/src/main/res/drawable/icon.png
            convert logo.png -resize 256x256 -strip -define png:format=png32 app/src/main/res/drawable/boot_logo.png
            convert logo.png -resize 256x256 -strip -define png:format=png32 app/src/main/res/drawable/logo.png

            # 3. 覆盖生成桌面各分辨率应用图标及快捷方式图标
            for res in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              DIR="app/src/main/res/mipmap-${res%%:*}"
              SIZE="${res##*:}"
              mkdir -p "$DIR"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/ic_launcher.png"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/ic_launcher_round.png"
              convert logo.png -resize ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/shorthand_icon.png"
            done

            # 4. 精准将 activity_boot.xml 中的原始 logo 资源引用替换为我们的 boot_logo
            find app/src/main/res/layout/ -name "activity_boot.xml" -exec sed -i 's|android:src="@drawable/[^"]*"|android:src="@drawable/boot_logo"|g' {} +

            echo "开屏画面资源与所有图标已覆盖就绪！"
          else
            echo "未在根目录找到 logo.png"
          fi

      # 步骤 3：生成正式签名并配置
      - name: Setup Signing Configuration
        run: |
          keytool -genkeypair -v -keystore release.jks -alias siyuan -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Jincheng, OU=Dev, O=JinchengNote, L=BJ, ST=BJ, C=CN"
          cp signings.templates.gradle signings.gradle
          sed -i "s|storeFile .*|storeFile file('../release.jks')|g" signings.gradle
          sed -i "s|storePassword .*|storePassword '123456'|g" signings.gradle
          sed -i "s|keyAlias .*|keyAlias 'siyuan'|g" signings.gradle
          sed -i "s|keyPassword .*|keyPassword '123456'|g" signings.gradle

      # 步骤 4：提取完整前端资产 (app.zip)
      - name: Extract Real Assets from Official Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_apk
          cd temp_apk
          gh release download --repo siyuan-note/siyuan --pattern "*.apk" --clobber
          APK_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          unzip -q "$APK_FILE"
          cd ..
          mkdir -p app/src/main/assets/
          cp temp_apk/assets/app.zip app/src/main/assets/
          rm -rf temp_apk

      # 步骤 5：生成干净的 AndroidManifest.xml（名称锁定为 金成笔记）
      - name: Generate Clean AndroidManifest.xml
        run: |
          python3 - << 'PY_EOF'
          content = '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" android:minSdkVersion="33" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />

              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />

              <application
                  android:name=".App"
                  android:enableOnBackInvokedCallback="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="金成笔记"
                  android:localeConfig="@xml/locales_config"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SiYuan"
                  android:usesCleartextTraffic="true"
                  tools:targetApi="tiramisu">

                  <activity
                      android:name=".BootActivity"
                      android:autoRemoveFromRecents="true"
                      android:configChanges="orientation|screenSize"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:theme="@style/Theme.SiYuan.Boot">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data
                          android:name="android.app.shortcuts"
                          android:resource="@xml/shortcuts" />
                  </activity>

                  <activity
                      android:name=".RedirectUriReceiverActivity"
                      android:excludeFromRecents="true"
                      android:exported="true"
                      android:noHistory="true"
                      android:theme="@style/Theme.SiYuan.Transparent">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="siyuan" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:autoRemoveFromRecents="true"
                      android:configChanges="keyboard|keyboardHidden|screenLayout|uiMode|orientation|screenSize|smallestScreenSize"
                      android:hardwareAccelerated="true"
                      android:theme="@style/Theme.SiYuan"
                      android:windowSoftInputMode="adjustResize" />

                  <activity
                      android:name=".ShortcutActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.AppCompat.DayNight.NoActionBar"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="shorthand" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/*" />
                      </intent-filter>
                      <intent-filter android:label="@string/shortcut_shorthand">
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/*" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepLiveService"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="hosting" />
                  </service>

                  <service
                      android:name=".KernelService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="hosting" />
                  </service>

                  <receiver android:name=".NotificationReceiver" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/provider_paths" />
                  </provider>

                  <meta-data
                      android:name="CHANNEL"
                      android:value="${CHANNEL}" />

              </application>

          </manifest>'''
          with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write(content)
          PY_EOF

      # 步骤 6：编译底层核心库 kernel.aar
      - name: Build SiYuan Kernel AAR
        env:
          CGO_ENABLED: '1'
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
        run: |
          git clone --depth=1 https://github.com/siyuan-note/siyuan.git /tmp/siyuan-core
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          gomobile init
          cd /tmp/siyuan-core/kernel
          gomobile bind -tags "fts5 sqlcipher" -ldflags "-s -w" -v -o kernel.aar -target android/arm64 -androidapi 26 ./mobile/
          mkdir -p $GITHUB_WORKSPACE/app/libs/
          cp kernel.aar $GITHUB_WORKSPACE/app/libs/
          rm -rf /tmp/siyuan-core

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 步骤 7：编译国内正式版 (Cn Release)
      - name: Build Domestic Release APK
        run: ./gradlew assembleCnRelease -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      # 步骤 8：上传 APK 安装包
      - name: Upload Domestic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 金成笔记-国内正式版
          path: app/build/outputs/apk/cn/release/*.apk
