name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Signing Config
        run: |
          cp signings.templates.gradle signings.gradle

      # 自动从官方主仓库拉取最新发布的内核与前端资产
      - name: Pull Kernel and Assets from Main SiYuan Release
        run: |
          mkdir -p temp_apk
          cd temp_apk
          
          # 获取官方最新 release tag 并下载安卓安装包
          TAG=$(curl -s https://api.github.com/repos/siyuan-note/siyuan/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION=${TAG#v}
          echo "Downloading official APK for version: $VERSION"
          curl -L -o official.apk "https://github.com/siyuan-note/siyuan/releases/download/${TAG}/siyuan-${VERSION}-android.apk"
          
          unzip -q official.apk
          cd ..

          # 注入前端资源
          mkdir -p app/src/main/assets/
          cp temp_apk/assets/app.zip app/src/main/assets/

          # 注入核心库 kernel.aar
          mkdir -p app/libs/
          mkdir -p aar_build/jni
          cp -r temp_apk/lib/* aar_build/jni/
          cat << 'EOF' > aar_build/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="mobile"></manifest>
          EOF
          cd aar_build
          zip -r ../app/libs/kernel.aar .
          cd ..

          rm -rf temp_apk aar_build

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 编译 Debug APK
      - name: Build APK
        run: ./gradlew assembleGoogleplayDebug -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-apk
          path: app/build/outputs/apk/**/*.apk
