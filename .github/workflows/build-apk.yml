name: Build Android APK (Release CN)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 自动接受 Android SDK 协议
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 步骤 1：修复 Maven 源（补充 gradlePluginPortal 防止 classpath 缺失）、配置包名与应用名
      - name: Configure App Info and Fix Maven Mirrors
        run: |
          NEW_APP_ID="com.jincheng.note"

          # 1. 彻底修复根目录 build.gradle 仓库源，加入 gradlePluginPortal() 与官方 google() / mavenCentral()
          sed -i '/repositories {/a \        gradlePluginPortal()\n        google()\n        mavenCentral()' build.gradle
          find . -type f -name "*.gradle" -exec sed -i 's|https*://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' {} +
          find . -type f -name "*.gradle" -exec sed -i 's|https*://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' {} +
          find . -type f -name "*.gradle" -exec sed -i 's|https*://maven.aliyun.com/[^'\''"]*|https://repo1.maven.org/maven2|g' {} +

          # 2. 清单更名与原生版本号维持
          curl -sSL https://raw.githubusercontent.com/siyuan-note/siyuan-android/main/app/src/main/AndroidManifest.xml -o app/src/main/AndroidManifest.xml
          sed -i 's/android:label="@string\/app_name"/android:label="金成笔记"/g' app/src/main/AndroidManifest.xml
          sed -i 's/android:label="思源笔记"/android:label="金成笔记"/g' app/src/main/AndroidManifest.xml

          # 3. 修复“闪念速记”快捷方式包名指向
          find app/src/main/res/ -name "shortcuts*.xml" -exec sed -i "s|targetPackage=\"org.b3log.siyuan\"|targetPackage=\"${NEW_APP_ID}\"|g" {} + || true

          sed -i "s/applicationId \".*\"/applicationId \"${NEW_APP_ID}\"/g" app/build.gradle
          if [ -f flavors.gradle ]; then
            sed -i "s/applicationId \".*\"/applicationId \"${NEW_APP_ID}\"/g" flavors.gradle
            sed -i "s/applicationPackageName = \".*\"/applicationPackageName = \"${NEW_APP_ID}\"/g" flavors.gradle
          fi

      # 步骤 2：生成原生位图资源与自适应图标
      - name: Rebuild Native Icons and Splash Safely
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          rm -f app/src/main/res/values/ic_launcher_background.xml
          if [ -f app/src/main/res/values/colors.xml ]; then
            sed -i 's|<color name="ic_launcher_background">.*</color>|<color name="ic_launcher_background">#1e1e1e</color>|g' app/src/main/res/values/colors.xml
          fi

          if [ -f logo.png ]; then
            mkdir -p app/src/main/res/drawable

            convert logo.png -resize 300x300 -gravity center -background none -extent 432x432 -strip -define png:format=png32 app/src/main/res/drawable/launcher_foreground_img.png
            convert logo.png -resize 256x256 -strip -define png:format=png32 app/src/main/res/drawable/boot_logo.png
            convert logo.png -resize 192x192 -strip -define png:format=png32 app/src/main/res/drawable/icon.png

            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<bitmap xmlns:android="http://schemas.android.com/apk/res/android"' \
              '    android:src="@drawable/launcher_foreground_img"' \
              '    android:gravity="center" />' > app/src/main/res/drawable/launcher_foreground.xml
            
            rm -f app/src/main/res/drawable/launcher_monochrome.xml

            mkdir -p app/src/main/res/mipmap-anydpi-v26
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <background android:drawable="@color/ic_launcher_background" />' \
              '    <foreground android:drawable="@drawable/launcher_foreground" />' \
              '</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

            if [ -f app/src/main/res/layout/activity_boot.xml ]; then
              sed -i 's|android:src="@drawable/icon"|android:src="@drawable/boot_logo"|g' app/src/main/res/layout/activity_boot.xml
              sed -i 's|android:text="思源笔记"|android:text="金成笔记"/g' app/src/main/res/layout/activity_boot.xml
            fi

            for res in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              DIR="app/src/main/res/mipmap-${res%%:*}"
              SIZE="${res##*:}"
              mkdir -p "$DIR"
              INNER_SIZE=$(awk "BEGIN {print int($SIZE * 0.72)}")
              convert logo.png -resize ${INNER_SIZE}x${INNER_SIZE} -gravity center -background "#1e1e1e" -extent ${SIZE}x${SIZE} -strip -define png:format=png32 "$DIR/ic_launcher.png"
              cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
              cp "$DIR/ic_launcher.png" "$DIR/shorthand_icon.png"
            done
          fi

      # 步骤 3：合成分卷并自动替换 PWA 清单
      - name: Assemble Custom app.zip and Patch Manifest
        run: |
          sudo apt-get install -y zip unzip
          cd app/src/main/assets/
          echo "正在合成分卷文件..."
          ls -lh app.zip.part*
          cat app.zip.part* > app.zip
          rm -f app.zip.part*

          mkdir -p /tmp/app_extracted
          unzip -q app.zip -d /tmp/app_extracted

          find /tmp/app_extracted/ -type f \( -name "*manifest*" -o -name "*.webmanifest" \) -exec sed -i 's/"name": *"SiYuan"/"name": "金成笔记"/g' {} +
          find /tmp/app_extracted/ -type f \( -name "*manifest*" -o -name "*.webmanifest" \) -exec sed -i 's/"short_name": *"SiYuan"/"short_name": "金成笔记"/g' {} +
          find /tmp/app_extracted/ -type f \( -name "*manifest*" -o -name "*.webmanifest" \) -exec sed -i 's/"name": *"思源笔记"/"name": "金成笔记"/g' {} +
          find /tmp/app_extracted/ -type f \( -name "*manifest*" -o -name "*.webmanifest" \) -exec sed -i 's/"short_name": *"思源笔记"/"short_name": "金成笔记"/g' {} +

          cd /tmp/app_extracted
          zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/app.zip" ./*
          rm -rf /tmp/app_extracted

          cd "$GITHUB_WORKSPACE/app/src/main/assets/"
          echo "Web 清单注入完成，当前 app.zip 大小："
          ls -lh app.zip

      # 步骤 4：生成 10 年固定签名证书
      - name: Setup 10-Year Fixed Signing Configuration
        run: |
          if [ ! -f release.jks ]; then
            echo "首次构建，正在生成 10 年有效期的固定签名密钥 release.jks ..."
            keytool -genkeypair -v -keystore release.jks -alias jincheng -keyalg RSA -keysize 2048 -validity 3650 -storepass 123456 -keypass 123456 -dname "CN=Jincheng, OU=Dev, O=JinchengNote, L=BJ, ST=BJ, C=CN"
          else
            echo "检测到已存在的签名密钥 release.jks，继续沿用该证书..."
          fi

          cp signings.templates.gradle signings.gradle
          sed -i "s|storeFile .*|storeFile file('../release.jks')|g" signings.gradle
          sed -i "s|storePassword .*|storePassword '123456'|g" signings.gradle
          sed -i "s|keyAlias .*|keyAlias 'jincheng'|g" signings.gradle
          sed -i "s|keyPassword .*|keyPassword '123456'|g" signings.gradle

      # 步骤 5：编译底层核心库 kernel.aar
      - name: Build SiYuan Kernel AAR
        env:
          CGO_ENABLED: '1'
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
        run: |
          git clone --depth=1 https://github.com/siyuan-note/siyuan.git /tmp/siyuan-core
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          gomobile init
          cd /tmp/siyuan-core/kernel
          gomobile bind -tags "fts5 sqlcipher" -ldflags "-s -w" -v -o kernel.aar -target android/arm64 -androidapi 26 ./mobile/
          mkdir -p $GITHUB_WORKSPACE/app/libs/
          cp kernel.aar $GITHUB_WORKSPACE/app/libs/
          rm -rf /tmp/siyuan-core

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 步骤 6：编译国内正式版
      - name: Build Domestic Release APK
        run: ./gradlew assembleCnRelease -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      # 步骤 7：将安装包名称从 siyuan 替换为 金成笔记
      - name: Rename APK to 金成笔记
        run: |
          cd app/build/outputs/apk/cn/release/
          for f in *.apk; do
            if [ -f "$f" ]; then
              NEW_NAME=$(echo "$f" | sed 's/siyuan/金成笔记/g')
              mv "$f" "$NEW_NAME"
              echo "已重命名: $f -> $NEW_NAME"
            fi
          done

      # 步骤 8：上传 APK 安装包与固定证书备份
      - name: Upload Domestic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 金成笔记-国内正式版
          path: |
            app/build/outputs/apk/cn/release/*.apk
            release.jks
