name: Build Android APK (Release CN)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 自动接受 Android SDK 协议
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 生成正式版 Release 签名并配置到 signings.gradle
      - name: Setup Signing Configuration
        run: |
          keytool -genkeypair -v -keystore release.jks -alias siyuan -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Jincheng, OU=Dev, O=JinchengNote, L=BJ, ST=BJ, C=CN"
          cp signings.templates.gradle signings.gradle
          sed -i "s|storeFile .*|storeFile file('../release.jks')|g" signings.gradle
          sed -i "s|storePassword .*|storePassword '123456'|g" signings.gradle
          sed -i "s|keyAlias .*|keyAlias 'siyuan'|g" signings.gradle
          sed -i "s|keyPassword .*|keyPassword '123456'|g" signings.gradle

      # 从官方 APK 提取完整的前端 UI 界面 (app.zip)
      - name: Extract Real Assets (app.zip) from Official Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_apk
          cd temp_apk
          gh release download --repo siyuan-note/siyuan --pattern "*.apk" --clobber
          APK_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          unzip -q "$APK_FILE"
          cd ..
          mkdir -p app/src/main/assets/
          cp temp_apk/assets/app.zip app/src/main/assets/
          rm -rf temp_apk

      # 编译底层核心库 kernel.aar
      - name: Build SiYuan Kernel AAR
        env:
          CGO_ENABLED: '1'
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
        run: |
          git clone --depth=1 https://github.com/siyuan-note/siyuan.git /tmp/siyuan-core
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          gomobile init
          cd /tmp/siyuan-core/kernel
          gomobile bind -tags "fts5 sqlcipher" -ldflags "-s -w" -v -o kernel.aar -target android/arm64 -androidapi 26 ./mobile/
          mkdir -p $GITHUB_WORKSPACE/app/libs/
          cp kernel.aar $GITHUB_WORKSPACE/app/libs/
          rm -rf /tmp/siyuan-core

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 编译国内正式版（Cn 渠道 Release 正式签名安装包）
      - name: Build Domestic Release APK
        run: ./gradlew assembleCnRelease -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      # 上传生成的 APK 安装包
      - name: Upload Domestic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 金成笔记-国内正式版
          path: app/build/outputs/apk/cn/release/*.apk
