name: Build Android APK (Release CN)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 自动接受 SDK 许可
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 步骤 1：自动生成正式版签名密钥（避免 Release 打包报错）
      - name: Generate Release Keystore & Configure Signing
        run: |
          keytool -genkeypair -v -keystore release.jks -alias siyuan -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Jincheng, OU=Dev, O=JinchengNote, L=BJ, ST=BJ, C=CN"
          cat << 'EOF' > signings.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('../release.jks')
                      storePassword '123456'
                      keyAlias 'siyuan'
                      keyPassword '123456'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          }
          EOF

      # 步骤 2：修改应用名称为“金成笔记”
      - name: Rename App to 金成笔记
        run: |
          # 替换 strings.xml 中的应用名称
          find app/src/main/res/ -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">金成笔记<\/string>/g' {} +

      # 步骤 3：获取或复用静态资源 app.zip
      - name: Fetch Assets if Missing
        if: "!hashFiles('app/src/main/assets/app.zip')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_apk
          cd temp_apk
          gh release download --repo siyuan-note/siyuan --pattern "*.apk" --clobber
          APK_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          unzip -q "$APK_FILE"
          cd ..
          mkdir -p app/src/main/assets/
          cp temp_apk/assets/app.zip app/src/main/assets/
          rm -rf temp_apk

      # 步骤 4：编译生成核心库 kernel.aar
      - name: Build Kernel AAR if Missing
        if: "!hashFiles('app/libs/kernel.aar')"
        env:
          CGO_ENABLED: '1'
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
        run: |
          git clone --depth=1 https://github.com/siyuan-note/siyuan.git /tmp/siyuan-core
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          gomobile init
          cd /tmp/siyuan-core/kernel
          gomobile bind -tags "fts5 sqlcipher" -ldflags "-s -w" -v -o kernel.aar -target android/arm64 -androidapi 26 ./mobile/
          mkdir -p $GITHUB_WORKSPACE/app/libs/
          cp kernel.aar $GITHUB_WORKSPACE/app/libs/
          rm -rf /tmp/siyuan-core

      # 将首次编译生成的依赖固化到仓库，避免以后重复拉取
      - name: Cache Dependencies to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/assets/app.zip app/libs/kernel.aar || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: cache kernel.aar and app.zip for offline build"
            git push || true
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 步骤 5：打出国内正式版（Cn 渠道 Release 正式签名包）
      - name: Build Domestic Release APK
        run: ./gradlew assembleCnRelease -PcompileSdkVersion=34 -PtargetSdkVersion=34 --no-daemon --stacktrace

      # 步骤 6：上传安装包
      - name: Upload Domestic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 金成笔记-国内正式版
          path: app/build/outputs/apk/cn/release/*.apk
